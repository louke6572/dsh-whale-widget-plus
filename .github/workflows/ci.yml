name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 语法检查
        run: |
          node --check lib/index.js
          node --check widget/lib/index.js
          node --check backend/lib/index.js
          node --check shims/qq-mode/lib/qq-mode.js

      - name: 图层审计
        run: node widget/tools/z-layer-audit.mjs

      - name: 开发机路径扫描
        run: |
          if grep -rn "TestBox" lib backend/lib widget/lib; then
            echo "发现开发机路径 TestBox，请先清理"; exit 1
          fi

      - name: 核心不变量审计
        run: node widget/tools/ci-audit.mjs --no-pack
